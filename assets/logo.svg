<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Premium Crimson Gradient -->
    <linearGradient id="tfg-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Chrome Silver Gradient -->
    <linearGradient id="tfg-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <!-- Subtle Red Glow -->
    <filter id="soft-red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Athletic Shield Emblem -->
  <g transform="translate(8, 6)">
    <!-- Outer Crimson Accent Ring -->
    <circle cx="44" cy="44" r="42" stroke="url(#tfg-crimson)" stroke-width="2.5" filter="url(#soft-red-glow)"/>
    
    <!-- Outer Orbit Accent -->
    <circle cx="44" cy="44" r="37" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.65"/>
    
    <!-- Obsidian Black Disc -->
    <circle cx="44" cy="44" r="33" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>

    <!-- Male Muscle Silhouette (Left) -->
    <path d="M 23,48 C 18,44 14,35 18,27 C 22,21 29,23 31,29 C 33,35 30,42 27,46 Z" fill="url(#tfg-crimson)"/>
    <circle cx="23.5" cy="22" r="4" fill="url(#tfg-crimson)"/>

    <!-- Female Muscle Silhouette (Right) -->
    <path d="M 65,48 C 70,44 74,35 70,27 C 66,21 59,23 57,29 C 55,35 58,42 61,46 Z" fill="url(#tfg-crimson)"/>
    <circle cx="64.5" cy="22" r="4" fill="url(#tfg-crimson)"/>

    <!-- Barbell Centerpiece -->
    <rect x="41.5" y="26" width="5" height="36" rx="2.5" fill="url(#tfg-silver)"/>
    <rect x="31" y="28" width="26" height="5" rx="1.5" fill="url(#tfg-crimson)"/>

    <!-- TFG Monogram -->
    <text x="44" y="56" font-family="'Oswald', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">TFG</text>
  </g>

  <!-- Brand Typography: TEMPLE FIT GYM -->
  <g transform="translate(108, 18)">
    <!-- Primary Brand Title -->
    <text x="0" y="38" font-family="'Oswald', 'Montserrat', sans-serif" font-weight="900" font-size="36" letter-spacing="1.5">
      <tspan fill="#ffffff">TEMPLE</tspan>
      <tspan dx="10" fill="url(#tfg-crimson)">FIT</tspan>
      <tspan dx="8" fill="url(#tfg-crimson)">GYM</tspan>
    </text>
    
    <!-- Sub-Badges Row -->
    <g transform="translate(0, 48)">
      <!-- 100% A/C Badge -->
      <rect x="0" y="0" width="38" height="19" rx="4" fill="#991b1b" stroke="#ef4444" stroke-width="1"/>
      <text x="19" y="13.5" font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">A/C</text>
      
      <!-- UNISEX Badge -->
      <rect x="44" y="0" width="56" height="19" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="72" y="13.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9.5" fill="#e4e4e7" text-anchor="middle" letter-spacing="0.8">UNISEX</text>
      
      <!-- CARDIO + STRENGTH Badge -->
      <text x="108" y="13.5" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#ef4444" letter-spacing="1.2">
        CARDIO <tspan fill="#71717a">+</tspan> STRENGTH
      </text>
    </g>
  </g>
</svg>
